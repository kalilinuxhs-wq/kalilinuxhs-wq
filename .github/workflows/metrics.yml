name: Metrics
on:
  # Schedule daily updates (At 00:00 UTC)
  schedule: [{cron: "0 0 * * *"}]
  # Allows you to run the workflow manually at any time
  workflow_dispatch:
  # Run workflow automatically when pushing to master or main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Main configuration for the layout in the image
          user: kalilinuxhs-wq
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          
          # Additional visual settings to match the template features
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          
          plugin_lines: yes
