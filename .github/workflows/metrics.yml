name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Main configuration
          user: kalilinuxhs-wq
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          
          # Language Stats
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_lines: yes

          # 🍢 Pinned Projects Block
          plugin_projects: yes
          plugin_projects_limit: 4

          # 📅 Coding Habits Block (Recent Activity Tracker)
          plugin_habits: yes
          plugin_habits_from: 200       # Review last 200 events
          plugin_habits_days: 14        # Look at last 14 days of coding
          plugin_habits_facts: yes      # Display coding facts
          plugin_habits_charts: yes     # Display active hours chart

          # 🍿 AniList Anime Watchlist Block
          plugin_anilist: yes
          plugin_anilist_user: kalilinuxhs
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, watching, paused
          plugin_anilist_limit: 2
