name: Metrics
on:
  schedule: [{cron: "0 16 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: 🦑 General Layout Panel
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: kalilinuxhs-wq
          base: header, activity, community, repositories, metadata
          base_indepth: no
          config_order: base.header, isocalendar, languages, notable
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 4

      - name: 🦑 Medias & Anime Panel
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: medias.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: kalilinuxhs-wq
          base: ""
          config_order: anilist
          plugin_anilist: yes
          plugin_anilist_user: kalilinuxhs
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, watching, paused, characters
          plugin_anilist_limit: 2
          plugin_anilist_limit_characters: 22

      - name: 🦑 Achievements Panel
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: kalilinuxhs-wq
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
